<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR Generator — Smart Thobe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span> Smart Thobe ID
  </div>

  <a class="ghost link" href="index.html">Home</a>
</header>

<main class="container narrow">

  <span class="pill">TAG SETUP</span>

  <h1>Create a person's QR code</h1>

  <p class="sub">
    Give each person a unique ID, then generate their QR code.
  </p>

  <section class="panel column">

    <label for="baseUrl">Your Smart Thobe website</label>

    <input
      id="baseUrl"
      type="url"
      value="https://azizmohaldawood-tech.github.io/smart-thobe"
    >

    <label for="tagId">Person's Tag ID</label>

    <input
      id="tagId"
      value="SAIF-001"
      placeholder="Example: SAIF-003"
    >

    <button id="makeQR" class="btn primary">
      Generate QR Code
    </button>

    <div id="qrcode" class="qrbox"></div>

    <code id="targetUrl"></code>

    <button id="printQR" class="btn secondary" hidden>
      🖨️ Print QR Code
    </button>

  </section>

  <section class="panel">

    <h2>How it works</h2>

    <p>
      Each person receives a unique Tag ID.
      Their QR code opens their emergency profile.
    </p>

    <p>
      Example:
    </p>

    <p>
      <strong>SAIF-001</strong> → Aziz
    </p>

    <p>
      <strong>SAIF-002</strong> → Mohammed
    </p>

    <p>
      <strong>SAIF-003</strong> → Person 3
    </p>

  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const base = document.getElementById("baseUrl");
const id = document.getElementById("tagId");
const out = document.getElementById("targetUrl");
const box = document.getElementById("qrcode");
const printBtn = document.getElementById("printQR");

document.getElementById("makeQR").onclick = () => {

  const tagId =
    (id.value || "SAIF-001").trim();

  const cleanBase =
    (base.value || "").replace(/\/+$/, "");

  const url =
    cleanBase +
    "/emergency.html?id=" +
    encodeURIComponent(tagId);

  box.innerHTML = "";

  new QRCode(box, {
    text: url,
    width: 240,
    height: 240
  });

  out.textContent = url;

  printBtn.hidden = false;
};

printBtn.onclick = () => {
  window.print();
};

</script>

</body>
</html>
