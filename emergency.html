/* =========================================================
   BASE64URL HELPERS
========================================================= */

function bytesToB64Url(bytes){

  let binary = "";

  for(const b of bytes){
    binary += String.fromCharCode(b);
  }

  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

function b64UrlToBytes(str){

  let b64 =
    String(str)
      .replace(/-/g,"+")
      .replace(/_/g,"/");

  while(b64.length % 4){
    b64 += "=";
  }

  const binary = atob(b64);

  const bytes =
    new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes;
}

/* =========================================================
   AES-GCM / PBKDF2
========================================================= */

const encoder = new TextEncoder();
const decoder = new TextDecoder();

async function deriveKey(pin,salt){

  const baseKey =
    await crypto.subtle.importKey(
      "raw",
      encoder.encode(pin),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

  return crypto.subtle.deriveKey(
    {
      name:"PBKDF2",
      salt:salt,
      iterations:150000,
      hash:"SHA-256"
    },
    baseKey,
    {
      name:"AES-GCM",
      length:256
    },
    false,
    ["decrypt"]
  );
}

async function decryptPrivate(box,pin){

  if(!box || !box.s || !box.iv || !box.ct){
    throw new Error("Invalid encrypted data");
  }

  const salt =
    b64UrlToBytes(box.s);

  const iv =
    b64UrlToBytes(box.iv);

  const ciphertext =
    b64UrlToBytes(box.ct);

  const key =
    await deriveKey(pin,salt);

  const plaintext =
    await crypto.subtle.decrypt(
      {
        name:"AES-GCM",
        iv:iv
      },
      key,
      ciphertext
    );

  return JSON.parse(
    decoder.decode(plaintext)
  );
}

let qrPacket = null;

/*
 New format:

 {
   v:2,
   public:{...},
   locked:{...},
   private:{
      s:"",
      iv:"",
      ct:""
   }
 }
*/

function decodeQRPacket(raw){

  try{

    const bytes =
      b64UrlToBytes(raw);

    const json =
      decoder.decode(bytes);

    return JSON.parse(json);

  }catch(e){

    console.error(
      "QR decode failed:",
      e
    );

    return null;
  }
}

const embeddedRaw =
  params.get("d");

if(embeddedRaw){

  qrPacket =
    decodeQRPacket(

  document.documentElement.dir =
    lang === "ar"

    "lang-ar",
    lang === "ar"

  document.getElementById(
    "langLabel"
  ).textContent =
    I18N[lang].lang_next;

  document
    .querySelectorAll(
      "[data-i18n]"
    )
    .forEach(el=>{

      const key =
        el.getAttribute(
          "data-i18n"
        );

      if(
        I18N[lang][key] !== undefined
      ){

        el.textContent =
          I18N[lang][key];

      }

    });

  updateHeader();
  updatePublicRows();
  updateCallButton();

  if(currentLocationUrl){
    updateShareLinks();
  }

/* =========================================================
   PHONE
========================================================= */

function cleanPhone(raw){

  if(!raw){
    return "";
  }

  let value =
    String(raw)
      .trim()
      .replace(/[^\d+]/g,"");

  value =
    value.replace(
      /(?!^)\+/g,
      ""
    );

  return value;
}

function isPhoneNumber(raw){

  return (
    cleanPhone(raw)
      .replace(/\D/g,"")
      .length >= 6
  );

}

   PUBLIC INFORMATION
========================================================= */

function publicValue(
  field,
  fallback
){

  if(locked[field]){

    return `
      <span class="lock-badge">
        🔒 ${fallback}
      </span>
    `;

  }

  return (
    person[field] ||
    I18N[lang].not_provided
  );

}

function updatePublicRows(){

  const contact =
    document.getElementById(
      "contactInfo"
    );

  /*
   IMPORTANT:
   If contact is NOT locked,
   show the actual phone number.
  */

  if(locked.contact){

    contact.innerHTML =
      publicValue(
        "contact",
        I18N[lang].prot_contact
      );

  }else{

    contact.textContent =
      person.contact ||
      I18N[lang].not_saved;

  }

  /*
   Add National ID to the information
   card if it doesn't already exist.
  */

  let idRow =
    document.getElementById(
      "nationalIdRow"
    );

  if(!idRow){

    idRow =
      document.createElement(
        "div"
      );

    idRow.className =
      "info-row";

    idRow.id =
      "nationalIdRow";

    idRow.innerHTML = `
      <span>National ID / Official ID</span>
      <strong id="nationalIdInfo"></strong>
    `;

    const infoCard =
      document.querySelector(
        ".info-card"
      );

    /*
     Put it before Language.
    */

    const rows =
      infoCard.querySelectorAll(
        ".info-row"
      );

    if(rows.length >= 2){

      infoCard.insertBefore(
        idRow,
        rows[1]
      );

    }else{

      infoCard.appendChild(
        idRow
      );

    }

  }

  const idInfo =
    document.getElementById(
      "nationalIdInfo"
    );

  if(locked.nationalId){

    idInfo.innerHTML =
      `<span class="lock-badge">
        🔒 Protected
       </span>`;

  }else{

    idInfo.textContent =
      person.nationalId ||
      I18N[lang].not_provided;

  }

}

/* =========================================================
   CALL BUTTON
========================================================= */

function updateCallButton(){

  const btn =
    document.getElementById(
      "callBtn"
    );

  const span =
    btn.querySelector("span");

  if(locked.contact){

    btn.classList.add(
      "disabled"
    );

    btn.href =
      "javascript:void(0)";

    span.textContent =
      I18N[lang].btn_contact;

    return;
  }

  if(
    isPhoneNumber(
      person.contact
    )
  ){

    btn.classList.remove(
      "disabled"
    );

    btn.href =
      "tel:" +
      cleanPhone(
        person.contact
      );

    span.textContent =
      I18N[lang].btn_contact;

  }else{

    btn.classList.add(
      "disabled"
    );

    btn.href =
      "javascript:void(0)";

    span.textContent =
      I18N[lang].btn_no_phone;

  }

}

========================================================= */

const statusEl =
  document.getElementById(
    "status"

function showStatus(
  message,
  isHTML=false
){

  statusEl.classList.add(
    "visible"
  );

  if(isHTML){

    statusEl.innerHTML =
      message;

  }else{

    statusEl.textContent =
      message;

  }

/* =========================================================
   CALL
========================================================= */

document
  .getElementById("callBtn")
  .addEventListener(
    "click",
    e=>{

      if(locked.contact){

        e.preventDefault();

        showStatus(
          I18N[lang].st_locked
        );

        return;
      }

      if(
        !isPhoneNumber(
          person.contact
        )
      ){

        e.preventDefault();

        showStatus(
          I18N[lang].st_no_phone
        );

        return;
      }

      showStatus(
        I18N[lang].st_calling +
        person.contact
      );

    }
  );

   LOCATION
========================================================= */

const sharePanel =
  document.getElementById(
    "sharePanel"
  );

const shareLoc =
  document.getElementById(
    "shareLoc"
  );

const shareSms =
  document.getElementById(
    "shareSms"
  );

const shareWa =
  document.getElementById(
    "shareWa"
  );

const shareCopy =
  document.getElementById(
    "shareCopy"
  );

const shareMaps =
  document.getElementById(
    "shareMaps"
  );

function updateShareLinks(){

  if(!currentLocationUrl){
    return;
  }

  const phone =
    isPhoneNumber(
      person.contact
    )
      ? cleanPhone(
          person.contact
        )
      : "";

  shareLoc.textContent =
    currentLocationUrl;

  const message =
    I18N[lang]
      .sms_body_prefix +
    currentLocationUrl;

  if(phone){

    shareSms.href =
      `sms:${phone}?body=${encodeURIComponent(message)}`;

    shareWa.href =
      `https://wa.me/${phone.replace(/^\+/,"")}?text=${encodeURIComponent(message)}`;

    shareSms.style.opacity="";
    shareWa.style.opacity="";

    shareSms.style.pointerEvents="";
    shareWa.style.pointerEvents="";

  }else{

    shareSms.href =
      "javascript:void(0)";

    shareWa.href =
      "javascript:void(0)";

    shareSms.style.opacity=".5";
    shareWa.style.opacity=".5";

    shareSms.style.pointerEvents=
      "none";

    shareWa.style.pointerEvents=
      "none";

  }

  shareMaps.href =
    currentLocationUrl;

}

document
  .getElementById("locationBtn")
  .addEventListener(
    "click",
    ()=>{

      if(!navigator.geolocation){

        showStatus(
          I18N[lang].st_no_geo
        );

        return;
      }

      showStatus(
        I18N[lang].st_requesting
      );

      navigator.geolocation.getCurrentPosition(

        pos=>{

          const lat =
            pos.coords.latitude
              .toFixed(6);

          const lon =
            pos.coords.longitude
              .toFixed(6);

          const accuracy =
            Math.round(
              pos.coords.accuracy || 0
            );

          currentLocationUrl =
            `https://www.google.com/maps?q=${lat},${lon}`;

          sharePanel.classList.add(
            "visible"
          );

          updateShareLinks();

          showStatus(
            `${I18N[lang].st_ready} (±${accuracy}m)`
          );

          setTimeout(
            ()=>{

              sharePanel.scrollIntoView({
                behavior:"smooth",
                block:"center"
              });

            },
            200
          );

        },

        err=>{

          if(err.code===1){

            showStatus(
              I18N[lang].st_denied
            );

          }else if(err.code===2){

            showStatus(
              I18N[lang].st_unavailable
            );

          }else if(err.code===3){

            showStatus(
              I18N[lang].st_timeout
            );

          }else{

            showStatus(
              I18N[lang].st_denied
            );

          }

        },

        {
          enableHighAccuracy:true,
          timeout:12000,
          maximumAge:0
        }

      );

    }
  );

/* =========================================================
   SHARE
========================================================= */

shareCopy.addEventListener(
  "click",
  async()=>{

    try{

      await navigator.clipboard.writeText(
        currentLocationUrl
      );

    }catch(e){

      const textarea =
        document.createElement(
          "textarea"
        );

      textarea.value =
        currentLocationUrl;

      document.body.appendChild(
        textarea
      );

      textarea.select();

      try{
        document.execCommand(
          "copy"
        );
      }catch(err){}

      textarea.remove();

    }

    showStatus(
      I18N[lang].st_copied
    );

  }
);

/* =========================================================
   IMPORTANT QR FIX
========================================================= */

function getEmergencyURL(){

  /*
   DO NOT DELETE ?d=...
   The old code did:

   current.search = "";

   which destroyed the profile data.
  */

  return window.location.href;

}

function renderQR(){

  const wrapper =
    document.getElementById(
      "qrWrapper"
    );

  const urlEl =
    document.getElementById(
      "qrUrl"
    );

  wrapper.innerHTML="";

  const url =
    getEmergencyURL();

  urlEl.textContent =
    url;

  if(
    typeof QRCode ===
    "undefined"
  ){

    wrapper.innerHTML =
      '<p style="color:#000;font-size:12px">QR library failed to load.</p>';

    return;
  }

  new QRCode(
    wrapper,
    {
      text:url,
      width:220,
      height:220,
      colorDark:"#000000",
      colorLight:"#ffffff",
      correctLevel:
        QRCode.CorrectLevel.M
    }
  );

}

   UNLOCK
========================================================= */

document
  .getElementById("unlockBtn")
  .addEventListener(
    "click",
    async()=>{

      if(!encryptedBox){

        /*
         Old demo profiles can still use
         the old demo PIN.
        */

        const oldPin =
          prompt(
            lang==="ar"
              ? "أدخل رمز PIN التجريبي:"
              : "Enter demo PIN:"
          );

        if(oldPin === "2468"){

          document.getElementById(
            "protected"
          ).hidden=false;

          renderProtected();

          showStatus(
            I18N[lang].st_prot_opened
          );

        }else if(
          oldPin !== null
        ){

          showStatus(
            I18N[lang].st_denied_pin
          );

        }

        return;
      }

      const pin =
        prompt(
          lang==="ar"
            ? "أدخل رمز PIN:"
            : "Enter PIN:"
        );

      if(pin === null){
        return;
      }

      if(!pin){

        showStatus(
          I18N[lang].st_denied_pin
        );

        return;
      }

      try{

        const decrypted =
          await decryptPrivate(
            encryptedBox,
            pin
          );

        /*
         ONLY replace protected fields
         with decrypted values.
        */

        Object.assign(
          person,
          decrypted
        );

        /*
         They are now unlocked locally
         for this page session.
        */

        for(
          const key of Object.keys(decrypted)
        ){

          locked[key]=false;

        }

        updateHeader();
        updatePublicRows();
        updateCallButton();
        renderProtected();

        document.getElementById(
          "protected"
        ).hidden=false;

        showStatus(
          I18N[lang].st_prot_opened
        );

      }catch(error){

        console.error(
          "PIN decrypt error:",
          error
        );

        showStatus(
          I18N[lang].st_denied_pin
        );

      }

    }
  );

/* =========================================================
   EDIT
========================================================= */

document
  .getElementById("editBtn")
  .addEventListener(
    "click",
    ()=>{

      document.getElementById(
        "editPanel"
      ).hidden=false;

      document.getElementById(
        "editName"
      ).value =
        person.name || "";

      document.getElementById(
        "editContact"
      ).value =
        person.contact || "";

      document.getElementById(
        "editBlood"
      ).value =
        person.blood || "";

      document.getElementById(
        "editMedical"
      ).value =
        person.medical || "";

      document.getElementById(
        "editPanel"
      ).scrollIntoView({
        behavior:"smooth",
        block:"nearest"
      });

    }
  );

/* =========================================================
   SAVE
========================================================= */

document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    ()=>{

      person.name =
        document.getElementById(
          "editName"
        ).value.trim()
        || "Unknown";

      person.contact =
        document.getElementById(
          "editContact"
        ).value.trim()
        || "Not provided";

      person.blood =
        document.getElementById(
          "editBlood"
        ).value.trim()
        || "Not provided";

      person.medical =
        document.getElementById(
          "editMedical"
        ).value.trim()
        || "Not provided";

      savedPeople[tag]={
        ...person,
        locked:{
          ...locked
        },
        private:
          encryptedBox
      };

      localStorage.setItem(
        "smartThobePeople",
        JSON.stringify(
          savedPeople
        )
      );

      updateHeader();
      updatePublicRows();
      updateCallButton();

      if(currentLocationUrl){
        updateShareLinks();
      }

      if(
        !document.getElementById(
          "protected"
        ).hidden
      ){

        renderProtected();

      }

      showStatus(
        I18N[lang].st_saved
      );

    }
  );

/* =========================================================
   START
========================================================= */

updateHeader();

applyLang(lang);

renderQR();

})();
</script>
